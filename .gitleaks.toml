title = "BlurHook SDK public source scan"
[extend]
useDefault = true
[[rules]]
id = "generic-api-key"
  [[rules.allowlists]]
  description = "Exact public Ethereum token addresses in retained encoder/quote fixtures; never credentials"
  condition = "AND"
  regexTarget = "line"
  paths = ['''(^|/)test/vectors/(encoder|app-quotes)\.json$''']
  regexes = [
    '''"token(?:In|Out)"\s*:\s*"(?:0x0000000000000000000000000000000000000000|0x0bd7d308f8e1639fab988df18a8011f41eacad73|0x117cc2133c37B721F49dE2A7a74833232B3B4C0C|0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168|0x5fc5360d0400a0fd4f2af552add042d716f1d168|0xd0601CE157Db5bdC3162BbaC2a2C8aF5320D9EEC|0xd0601ce157db5bdc3162bbac2a2c8af5320d9eec|0xf44702b17d9abD53815F703e772F35E9c71A53af|0xf44702b17d9abd53815f703e772f35e9c71a53af)"''',
  ]
